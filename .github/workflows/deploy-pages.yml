name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Astronomy Engine (vendor)
        run: |
          mkdir -p public/vendor
          for i in 1 2 3 4 5; do
            curl -fsSL -o public/vendor/astronomy.js https://raw.githubusercontent.com/cosinekitty/astronomy/master/source/js/astronomy.js && break
            sleep 5
          done
          echo "716c921ad815df4174828663961fee7ec81906ad  public/vendor/astronomy.js" | sha1sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - id: deployment
        uses: actions/deploy-pages@v4
